name: rights-provenance-audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "dispositivo/governance/**"
      - "dispositivo/runtime/v0_2_15_3/BASE_CORRECTOR_DIDXAZA_SURFACE_SEMANTICS_v2_20.sqlite"
      - ".github/workflows/rights-provenance-audit.yml"
  pull_request:
    branches:
      - main
    paths:
      - "dispositivo/governance/**"
      - "dispositivo/runtime/v0_2_15_3/BASE_CORRECTOR_DIDXAZA_SURFACE_SEMANTICS_v2_20.sqlite"
      - ".github/workflows/rights-provenance-audit.yml"

permissions:
  contents: read

jobs:
  sqlite-provenance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Audit runtime SQLite provenance metadata
        shell: bash
        run: |
          set -euo pipefail
          python dispositivo/governance/audit_runtime_rights_sources.py \
            --output "${RUNNER_TEMP}/RIGHTS_SQLITE_PROVENANCE_AUDIT.json"

      - name: Upload rights provenance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rights-sqlite-provenance-${{ github.sha }}
          path: ${{ runner.temp }}/RIGHTS_SQLITE_PROVENANCE_AUDIT.json
