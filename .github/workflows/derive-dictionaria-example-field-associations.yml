name: derive-dictionaria-example-field-associations

on:
  push:
    branches:
      - "feature/verb-analysis-bridge-v0-2-final"
    paths:
      - "dispositivo/analyzer/derive_dictionaria_example_field_associations.py"
      - ".github/workflows/derive-dictionaria-example-field-associations.yml"

permissions:
  contents: write

jobs:
  derive:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/verb-analysis-bridge-v0-2-final

      - name: Derive pinned Dictionaria TAM associations
        shell: bash
        run: |
          set -euo pipefail
          python dispositivo/analyzer/derive_dictionaria_example_field_associations.py
          test -s dispositivo/sources/DICTIONARIA_EXAMPLE_FIELD_ASSOCIATIONS_v0_1.csv
          head -n 5 dispositivo/sources/DICTIONARIA_EXAMPLE_FIELD_ASSOCIATIONS_v0_1.csv

      - name: Commit deterministic derivative to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add dispositivo/sources/DICTIONARIA_EXAMPLE_FIELD_ASSOCIATIONS_v0_1.csv
          if git diff --cached --quiet; then
            echo "No derived change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materializar asociaciones TAM de Dictionaria"
          git push origin HEAD:feature/verb-analysis-bridge-v0-2-final
