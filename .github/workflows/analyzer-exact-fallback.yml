name: analyzer-exact-fallback

on:
  push:
    branches:
      - "feature/analyzer-exact-fallback-*"
      - "feature/biyubi-source-layer-*"
      - "feature/analyzer-documentary-candidates-*"
      - "feature/analyzer-structured-morph-candidate-*"
      - "feature/analyzer-documented-1sg-fusion-*"
    paths:
      - "dispositivo/analyzer/**"
      - "dispositivo/sources/**"
      - ".github/workflows/analyzer-exact-fallback.yml"
  pull_request:
    branches:
      - main
    paths:
      - "dispositivo/analyzer/**"
      - "dispositivo/sources/**"
      - ".github/workflows/analyzer-exact-fallback.yml"

permissions:
  contents: read

jobs:
  fallback:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Analyzer technical regressions
        shell: bash
        run: |
          set -euo pipefail
          python dispositivo/analyzer/test_exact_existing_layer_fallback.py -v
          python dispositivo/analyzer/test_biyubi_exact_source.py -v
          python dispositivo/analyzer/test_documentary_candidate_layer.py -v
          python dispositivo/analyzer/test_person_fusion_candidate.py -v
          python dispositivo/analyzer/test_documented_person_fusion_analysis.py -v
          python dispositivo/analyzer/test_new_written_analysis_target_runner.py -v

      - name: Re-run first real-text probe through current Analyzer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "${RUNNER_TEMP}/REAL_TEXT_PROBE_001_AFTER_FALLBACK.json"
          import json, sys
          from pathlib import Path

          root = Path.cwd()
          analyzer_dir = root / 'dispositivo' / 'analyzer'
          runtime_dir = root / 'dispositivo' / 'runtime' / 'v0_2_15_3'
          sys.path.insert(0, str(analyzer_dir))
          sys.path.insert(0, str(runtime_dir))
          from analyzer_v0_35_migrated_adapter import build_migrated_analyzer

          lines = [
              'Biaa gu’yu’ siou’',
              'Nuu xquie naxhi ne nuu naxí',
              'Tecu dxandí’ ni riní’',
              'Biaa gu’yu’ siou’',
          ]
          engine = build_migrated_analyzer()
          try:
              rows = [
                  engine.analyze(line, item_id=f'REAL_TEXT_PROBE_001_L{i:02d}')
                  for i, line in enumerate(lines, 1)
              ]
          finally:
              engine.close()

          print(json.dumps({
              'probe_id': 'REAL_TEXT_PROBE_001_AFTER_CURRENT_ANALYZER',
              'cor001_used': False,
              'benchmark_use': False,
              'rule_discovery': False,
              'biyubi_payload_mounted_in_public_ci': False,
              'candidate_layer_is_non_exact': True,
              'documented_morphology_is_separate_from_exact_evidence': True,
              'results': rows,
          }, ensure_ascii=False, indent=2, sort_keys=True))
          PY
          cat "${RUNNER_TEMP}/REAL_TEXT_PROBE_001_AFTER_FALLBACK.json"

      - name: Upload real-text probe result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-text-probe-001-after-current-analyzer-${{ github.sha }}
          path: ${{ runner.temp }}/REAL_TEXT_PROBE_001_AFTER_FALLBACK.json

      - name: Upload ephemeral executable checkout bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: analyzer-executable-bundle-${{ github.sha }}
          path: dispositivo
          compression-level: 0

      - name: Checkout published Dictionaria source data at exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dictionaria/didxazageneral
          ref: 76c22cf30c23d8f4bc5c83c11013a8cb24fe0f85
          path: _external_didxazageneral

      - name: Extract targeted independent Dictionaria source records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "${RUNNER_TEMP}/DICTIONARIA_TARGETED_SOURCE_RECORDS.json"
          import csv, json
          from pathlib import Path

          root = Path('_external_didxazageneral/cldf')
          needles = ('rindani', 'gundani')
          out = {
              'source_repository': 'dictionaria/didxazageneral',
              'source_commit': '76c22cf30c23d8f4bc5c83c11013a8cb24fe0f85',
              'source_role': 'PUBLISHED_PRIMARY_DICTIONARY_DATA',
              'query_role': 'INDEPENDENT_TARGETED_SOURCE_RECOVERY',
              'rule_discovery_from_analysis_target': False,
              'files': {},
          }
          for filename in ('entries.csv', 'senses.csv', 'examples.csv'):
              matches = []
              path = root / filename
              with path.open(encoding='utf-8-sig', newline='') as f:
                  reader = csv.DictReader(f)
                  for row in reader:
                      haystack = '\n'.join(str(v) for v in row.values()).casefold()
                      if any(n in haystack for n in needles):
                          matches.append(dict(row))
              out['files'][filename] = matches
          print(json.dumps(out, ensure_ascii=False, indent=2, sort_keys=True))
          PY
          cat "${RUNNER_TEMP}/DICTIONARIA_TARGETED_SOURCE_RECORDS.json"

      - name: Upload targeted Dictionaria source records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dictionaria-targeted-source-records-${{ github.sha }}
          path: ${{ runner.temp }}/DICTIONARIA_TARGETED_SOURCE_RECORDS.json
