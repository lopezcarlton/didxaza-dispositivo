name: real-text-probe

on:
  push:
    branches:
      - "experiment/**"
    paths:
      - "dispositivo/experiments/**"
      - ".github/workflows/real-text-probe.yml"
  pull_request:
    branches:
      - main
    paths:
      - "dispositivo/experiments/**"
      - ".github/workflows/real-text-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run exact real-text probe
        shell: bash
        run: |
          set -euo pipefail
          python dispositivo/experiments/run_real_text_probe.py > "${RUNNER_TEMP}/REAL_TEXT_PROBE_001_RESULT.json"
          cat "${RUNNER_TEMP}/REAL_TEXT_PROBE_001_RESULT.json"

      - name: Run unmatched-token coverage diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python dispositivo/experiments/run_real_text_probe_coverage.py > "${RUNNER_TEMP}/REAL_TEXT_PROBE_001_COVERAGE.json"
          cat "${RUNNER_TEMP}/REAL_TEXT_PROBE_001_COVERAGE.json"

      - name: Upload probe result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-text-probe-001-${{ github.sha }}
          path: |
            ${{ runner.temp }}/REAL_TEXT_PROBE_001_RESULT.json
            ${{ runner.temp }}/REAL_TEXT_PROBE_001_COVERAGE.json
