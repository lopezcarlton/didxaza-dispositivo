name: real-text-probe-002

on:
  workflow_dispatch:
  push:
    branches:
      - "experiment/real-text-probe-002-*"
    paths:
      - "dispositivo/experiments/REAL_TEXT_PROBE_002.txt"
      - "dispositivo/experiments/run_real_text_probe_002.py"
      - ".github/workflows/real-text-probe-002.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run current Analyzer on REAL_TEXT_PROBE_002
        shell: bash
        run: |
          set -euo pipefail
          python dispositivo/experiments/run_real_text_probe_002.py > "${RUNNER_TEMP}/REAL_TEXT_PROBE_002_RESULT.json"
          cat "${RUNNER_TEMP}/REAL_TEXT_PROBE_002_RESULT.json"

      - name: Upload probe result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-text-probe-002-${{ github.sha }}
          path: ${{ runner.temp }}/REAL_TEXT_PROBE_002_RESULT.json
