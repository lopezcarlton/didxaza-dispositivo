name: measure-pb2015-pdlma-crosswalk

on:
  push:
    branches:
      - "feature/pb2015-explicit-valency-relations-*"
    paths:
      - ".github/workflows/measure-pb2015-pdlma-crosswalk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Device
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout pinned Voces
        shell: bash
        run: |
          set -euo pipefail
          VOCES="${RUNNER_TEMP}/vocesdelasnubes"
          git init "$VOCES"
          git -C "$VOCES" remote add origin https://github.com/lopezcarlton/vocesdelasnubes.git
          git -C "$VOCES" fetch --depth=1 origin f17c5363caada6f8beb18fa99c39e37cd72c6f09
          git -C "$VOCES" checkout --detach FETCH_HEAD
          test "$(git -C "$VOCES" rev-parse HEAD)" = "f17c5363caada6f8beb18fa99c39e37cd72c6f09"

      - name: Measure raw PDLMA equality only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, os
          from collections import defaultdict, Counter
          from pathlib import Path

          device = Path.cwd()
          voces = Path(os.environ['RUNNER_TEMP']) / 'vocesdelasnubes'
          relation_path = voces / 'conocimiento/derivados/PB2015_VALENCY_RELATIONS_SELECTED_v0_1.csv'
          inventory_path = device / 'dispositivo/analyzer/DIC_VERB_2385_v0_1.csv'

          with relation_path.open(encoding='utf-8', newline='') as f:
              relations = list(csv.DictReader(f))
          with inventory_path.open(encoding='utf-8-sig', newline='') as f:
              inventory = list(csv.DictReader(f))

          by_pdlma = defaultdict(list)
          for row in inventory:
              # STRICT raw equality only. No split on variants; if a technical record
              # stores a composite pdlma string, it must equal the PB2015 member as-is.
              by_pdlma[row['pdlma']].append(row)

          results = []
          for rel in relations:
              raw = rel['source_form_pdlma_raw']
              matches = by_pdlma.get(raw, [])
              results.append({
                  'relation_set_id': rel['relation_set_id'],
                  'source_group': rel['source_group'],
                  'relation_role': rel['relation_role'],
                  'source_form_pdlma_raw': raw,
                  'match_count': len(matches),
                  'entry_ids': [m['entry_id'] for m in matches],
                  'entry_headwords_ap': [m['headword'] for m in matches],
                  'entry_pdlma_raw': [m['pdlma'] for m in matches],
                  'comparison_policy': 'BYTE_TEXT_EQUALITY_AFTER_CSV_DECODE_NO_NORMALIZATION',
              })

          dist = Counter(r['match_count'] for r in results)
          sets = defaultdict(list)
          for row in results:
              sets[row['relation_set_id']].append(row)
          fully_unique_sets = [
              sid for sid, members in sets.items()
              if all(m['match_count'] == 1 for m in members)
          ]
          partially_unique_sets = [
              sid for sid, members in sets.items()
              if any(m['match_count'] == 1 for m in members)
          ]
          stats = {
              'voces_commit': 'f17c5363caada6f8beb18fa99c39e37cd72c6f09',
              'selected_relation_members': len(results),
              'selected_relation_sets': len(sets),
              'strict_match_count_distribution': {str(k): v for k, v in sorted(dist.items())},
              'members_with_unique_strict_match': dist[1],
              'members_with_zero_strict_match': dist[0],
              'members_with_multiple_strict_matches': sum(v for k, v in dist.items() if k > 1),
              'fully_unique_strict_relation_sets': len(fully_unique_sets),
              'fully_unique_strict_relation_set_ids': fully_unique_sets,
              'relation_sets_with_at_least_one_unique_strict_member': len(partially_unique_sets),
              'group_member_unique_counts': dict(sorted(Counter(
                  r['source_group'] for r in results if r['match_count'] == 1
              ).items())),
              'policy': {
                  'unicode_normalization': False,
                  'casefold': False,
                  'hyphen_removal': False,
                  'dot_removal': False,
                  'tone_stripping': False,
                  'diacritic_stripping': False,
                  'glottal_conversion': False,
                  'asterisk_removal': False,
                  'bang_removal': False,
                  'variant_splitting': False,
                  'pdlma_to_ap': False,
              },
          }

          out = Path(os.environ['RUNNER_TEMP']) / 'pb2015_crosswalk'
          out.mkdir(parents=True, exist_ok=True)
          (out/'PB2015_STRICT_PDLMA_CROSSWALK_STATS.json').write_text(
              json.dumps(stats, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8'
          )
          (out/'PB2015_STRICT_PDLMA_CROSSWALK.json').write_text(
              json.dumps(results, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8'
          )
          print('PB2015_STRICT_PDLMA_CROSSWALK_STATS=' + json.dumps(stats, ensure_ascii=False, sort_keys=True))
          print('PB2015_STRICT_PDLMA_UNMATCHED=' + json.dumps([
              {'set': r['relation_set_id'], 'role': r['relation_role'], 'pdlma': r['source_form_pdlma_raw']}
              for r in results if r['match_count'] == 0
          ], ensure_ascii=False, sort_keys=True))
          print('PB2015_STRICT_PDLMA_MATCHED=' + json.dumps([
              {'set': r['relation_set_id'], 'role': r['relation_role'], 'pdlma': r['source_form_pdlma_raw'], 'entry_ids': r['entry_ids']}
              for r in results if r['match_count'] == 1
          ], ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload measurement
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pb2015-strict-pdlma-crosswalk
          path: ${{ runner.temp }}/pb2015_crosswalk/
